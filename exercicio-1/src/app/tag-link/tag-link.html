<H2>LINKS</H2>

<p>Sobre a tag de link, normalmente esta tag vem dentro de algo. <a href="www.google.com">O meu link</a></p>
<h4><a href="">Login</a></h4>
<p>Link com target Blank, este é o mais usado, abre a ligação numa página ao lado. <a href="https://www.facebook.com/" target="_blank">Facebook</a></p>
<p>Link com target Parent. <a href="https://www.instagram.com/" target="_parent">Instagram</a></p>
<p>Link com target Self <a href="https://www.linkedin.com/" target="_self">LinkedIn</a></p>
<p>Link com target Top <a href="https://www.substack.com/" target="_top">Substack</a></p>
